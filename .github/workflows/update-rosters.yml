name: Update Rosters

# Pulls 2025-26+ rosters from NBA.com box scores (20_fetch_recent_rosters.py),
# rebuilds the static game data (19_export_static_data.py), commits any change
# and redeploys. Weekly during the season picks up trades and signings.
# NBA.com is not reachable from the dev container, so this runs here.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'   # Mondays 10:23 UTC

permissions:
  contents: write
  actions: write

concurrency:
  group: rosters
  cancel-in-progress: false

jobs:
  update:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install networkx==3.7

      - name: Fetch rosters from NBA.com box scores
        run: python data/etl/20_fetch_recent_rosters.py

      - name: Rebuild static game data
        run: python data/etl/19_export_static_data.py

      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/rosters frontend/public/data
          if git diff --cached --quiet; then
            echo "Rosters unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update rosters from NBA.com box scores"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows; dispatch the deploy
          gh workflow run deploy-pages.yml --ref main
